apiVersion: v1
kind: Namespace
metadata:
  name: clotho-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clotho-operator-role
rules:
- apiGroups: ["core.clotho.run"]
  resources: ["pipelines"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["core.spinwasm.org"]
  resources: ["spinapps"]
  verbs: ["*"]
# Add Traefik/Ingress permissions here later