apiVersion: v1
kind: Namespace
metadata:
  name: clotho-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clotho-registry
  namespace: clotho-system
  labels:
    app: clotho-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clotho-registry
  template:
    metadata:
      labels:
        app: clotho-registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: registry-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: clotho-registry
  namespace: clotho-system
spec:
  selector:
    app: clotho-registry
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
