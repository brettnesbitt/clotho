---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: pipelines.core.clotho.run
spec:
  group: core.clotho.run
  names:
    kind: Pipeline
    listKind: PipelineList
    plural: pipelines
    singular: pipeline
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.runtime
      name: Runtime
      type: string
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.url
      name: URL
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Pipeline is the Schema for the pipelines API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PipelineSpec defines the desired state of Pipeline
            properties:
              build:
                description: |-
                  Build defines external image builder configuration (Tier 1.5).
                  When specified, the operator triggers builds on external services (e.g., Cloud Build)
                  instead of building locally in-cluster. The operator watches for build completion
                  and pulls the resulting image from the specified registry.
                properties:
                  buildArgs:
                    additionalProperties:
                      type: string
                    description: |-
                      BuildArgs are additional arguments passed to the build process.
                      For Cloud Build, these become substitution variables (_KEY=value).
                    type: object
                  buildBackoffBase:
                    default: 1m
                    description: |-
                      BuildBackoffBase is the base duration for exponential backoff between retries.
                      Each retry waits BuildBackoffBase * 2^(attempt-1), capped at 30 minutes.
                      Examples: "30s", "1m", "5m". Defaults to "1m".
                    type: string
                  builder:
                    description: Builder specifies the external build service to use.
                    enum:
                    - cloudbuild
                    - github-actions
                    - gitlab-ci
                    - tekton
                    - custom
                    type: string
                  credentialsSecret:
                    description: |-
                      CredentialsSecret is the name of a Secret containing registry credentials.
                      The secret should have:
                        - "username" and "password" keys for basic auth
                        - OR "token" key for token-based auth (e.g., GCP service account JSON)
                    type: string
                  dockerfile:
                    default: Dockerfile
                    description: |-
                      Dockerfile is the path to the Dockerfile (for container builds).
                      Defaults to "Dockerfile" in the repository root.
                    type: string
                  maxBuildRetries:
                    default: 3
                    description: |-
                      MaxBuildRetries is the maximum number of times the operator will retry a
                      failed build before marking the pipeline as BuildFailed and giving up.
                      Set to 0 to disable retries entirely.
                    format: int32
                    maximum: 10
                    minimum: 0
                    type: integer
                  pollInterval:
                    description: |-
                      PollInterval enables periodic polling of the upstream git ref. When set,
                      the operator checks the remote SHA for spec.reference every PollInterval
                      and clears spec.image to trigger a rebuild if the SHA has moved since the
                      last successful build. Leave empty to disable polling (the operator will
                      only rebuild when spec.reference or spec.image change, or the Pipeline
                      is deleted and recreated). Examples: "5m", "15m", "1h".
                      Currently supports GitHub via the REST API
                      (https://api.github.com/repos/{owner}/{repo}/commits/{ref}).
                    type: string
                  registry:
                    description: |-
                      Registry is the target image registry where the built image will be pushed.
                      Example: "gcr.io/my-project/clotho-pipelines"
                    type: string
                  serviceAccountSecret:
                    description: |-
                      ServiceAccountSecret is the name of a Secret containing the external builder's
                      service account credentials (e.g., Cloud Build service account key).
                      The secret format depends on the builder type:
                        - cloudbuild: GCP service account JSON key
                        - github-actions: GitHub PAT with repo and workflow scopes
                        - gitlab-ci: GitLab CI/CD token
                    type: string
                  timeout:
                    default: 10m
                    description: |-
                      Timeout is the maximum time to wait for the external build to complete.
                      Defaults to "10m".
                    type: string
                required:
                - builder
                - registry
                type: object
              config:
                description: |-
                  2. Runtime Configuration (The "Variables")
                  Defines environment variables and secret injections.
                items:
                  description: ConfigVar allows injecting values or secrets into the
                    runtime
                  properties:
                    name:
                      description: Name of the environment variable (e.g. "DB_PASSWORD")
                      type: string
                    value:
                      description: Value is a literal string value (e.g. "production")
                      type: string
                    valueFrom:
                      description: ValueFrom allows selecting a key from a Secret
                        or ConfigMap
                      properties:
                        secretKeyRef:
                          description: Selects a key from a Secret in the same namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                type: array
              gitCredentialsSecret:
                description: |-
                  GitCredentialsSecret is the name of a Secret containing git credentials.
                  The secret should have a "token" key with a GitHub PAT or similar token.
                type: string
              gitRepository:
                description: |-
                  1. Source Control (The "Code")
                  If provided, the Clotho Builder will clone, compile, and push to the internal registry.
                  If omitted and Image is provided, the builder is skipped entirely (Tier 2: BYOR).
                type: string
              image:
                description: |-
                  Image is the OCI image reference for the built pipeline.
                  For Tier 1 (builder): populated automatically after build completes.
                  For Tier 2 (BYOR): set by the user to skip the builder entirely.
                type: string
              imagePullSecrets:
                description: |-
                  ImagePullSecrets is a list of references to secrets for pulling from private registries.
                  Only needed for Tier 2 (BYOR) when the image is in a private external registry (GCP, AWS, etc).
                  These are passed through to the SpinApp so Kubernetes can authenticate the pull.
                items:
                  description: |-
                    LocalObjectReference contains enough information to let you locate the
                    referenced object inside the same namespace.
                  properties:
                    name:
                      default: ""
                      description: |-
                        Name of the referent.
                        This field is effectively required, but due to backwards compatibility is
                        allowed to be empty. Instances of this type with an empty value here are
                        almost certainly wrong.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                type: array
              messageBus:
                description: |-
                  7. Message Bus Configuration (The "Glue")
                  Defines the message bus used for inter-stage communication.
                properties:
                  clusterRef:
                    description: ClusterRef references a NATS/Kafka/Redis cluster
                      in the same namespace.
                    type: string
                  config:
                    additionalProperties:
                      type: string
                    description: Config defines additional configuration for the message
                      bus.
                    type: object
                  type:
                    default: nats-jetstream
                    description: Type specifies the message bus implementation.
                    enum:
                    - nats-jetstream
                    - kafka
                    - redis-streams
                    type: string
                required:
                - type
                type: object
              mode:
                allOf:
                - enum:
                  - stream
                  - once
                  - batch
                - enum:
                  - stream
                  - once
                  - batch
                default: stream
                description: |-
                  Mode is the execution model for this pipeline.
                  Determines how telemetry is stored and displayed.
                type: string
              path:
                description: |-
                  Path is the subdirectory within the repository containing the pipeline code.
                  Use this for monorepos where the Cargo.toml is not at the root.
                type: string
              policy:
                description: |-
                  4. Operational Policy (The "Guardrails")
                  Defines timeouts, retries, and scaling constraints.
                properties:
                  maxRetries:
                    default: 3
                    description: 'MaxRetries: How many times to retry on failure.'
                    format: int32
                    type: integer
                  timeoutSeconds:
                    default: 30
                    description: 'TimeoutSeconds: Max execution time before the worker
                      is killed.'
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              reference:
                default: main
                description: Reference is the branch, tag, or commit. Defaults to
                  "main".
                type: string
              replicas:
                default: 1
                description: replicas is the desired number of replicas.
                format: int32
                type: integer
              resources:
                default:
                  limits:
                    cpu: 100m
                    memory: 128Mi
                  requests:
                    cpu: 5m
                    memory: 32Mi
                description: |-
                  3. Compute Requirements (The "Iron")
                  Defines CPU/Memory limits. If not set, defaults to a "Tiny" profile.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              runtime:
                allOf:
                - enum:
                  - wasm
                  - native
                - enum:
                  - wasm
                  - native
                default: wasm
                description: 'Runtime selects the execution target: "wasm" (SpinApp)
                  or "native" (Deployment).'
                type: string
              schedule:
                description: |-
                  5. Schedule (The "When")
                  Defines how and when the operator invokes this pipeline.
                  If omitted, defaults to "trigger" mode (on-demand only via API).
                properties:
                  cron:
                    description: |-
                      Cron is a standard cron expression (e.g. "0 9 * * *").
                      Only used when mode is "cron".
                    type: string
                  interval:
                    description: |-
                      Interval is the duration between invocations (e.g. "30s", "5m", "1h").
                      Only used when mode is "interval".
                    type: string
                  mode:
                    default: trigger
                    description: 'Mode: "trigger" (on-demand), "interval" (every N
                      seconds), or "cron" (cron expression).'
                    enum:
                    - trigger
                    - interval
                    - cron
                    type: string
                required:
                - mode
                type: object
              stages:
                description: |-
                  6. DAG Stages (The "Topology")
                  Defines multi-stage pipeline topology for DAG-based pipelines.
                  When stages are defined, the operator creates separate workloads for each stage.
                items:
                  description: PipelineStage defines a single stage in a DAG pipeline
                  properties:
                    config:
                      description: |-
                        Config defines environment variables specific to this stage.
                        Merged with the parent pipeline config.
                      items:
                        description: ConfigVar allows injecting values or secrets
                          into the runtime
                        properties:
                          name:
                            description: Name of the environment variable (e.g. "DB_PASSWORD")
                            type: string
                          value:
                            description: Value is a literal string value (e.g. "production")
                            type: string
                          valueFrom:
                            description: ValueFrom allows selecting a key from a Secret
                              or ConfigMap
                            properties:
                              secretKeyRef:
                                description: Selects a key from a Secret in the same
                                  namespace
                                properties:
                                  key:
                                    description: The key of the secret to select from.  Must
                                      be a valid secret key.
                                    type: string
                                  name:
                                    default: ""
                                    description: |-
                                      Name of the referent.
                                      This field is effectively required, but due to backwards compatibility is
                                      allowed to be empty. Instances of this type with an empty value here are
                                      almost certainly wrong.
                                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                    type: string
                                  optional:
                                    description: Specify whether the Secret or its
                                      key must be defined
                                    type: boolean
                                required:
                                - key
                                type: object
                                x-kubernetes-map-type: atomic
                            type: object
                        required:
                        - name
                        type: object
                      type: array
                    dependsOn:
                      description: |-
                        DependsOn defines which stages must complete before this stage can start.
                        This creates the DAG edges.
                      items:
                        type: string
                      type: array
                    entrypoint:
                      description: |-
                        Entrypoint is the binary name for this stage.
                        For native runtime: the compiled binary name (e.g. "ingestor", "worker").
                        For wasm runtime: the component name within the Spin app.
                      type: string
                    name:
                      description: Name is the unique identifier for this stage within
                        the pipeline.
                      type: string
                    replicas:
                      default: 1
                      description: Replicas is the number of replicas for this stage.
                      format: int32
                      type: integer
                    resources:
                      description: |-
                        Resources defines compute requirements for this stage.
                        If not set, inherits from the parent pipeline spec.
                      properties:
                        claims:
                          description: |-
                            Claims lists the names of resources, defined in spec.resourceClaims,
                            that are used by this container.

                            This field depends on the
                            DynamicResourceAllocation feature gate.

                            This field is immutable. It can only be set for containers.
                          items:
                            description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                            properties:
                              name:
                                description: |-
                                  Name must match the name of one entry in pod.spec.resourceClaims of
                                  the Pod where this field is used. It makes that resource available
                                  inside a container.
                                type: string
                              request:
                                description: |-
                                  Request is the name chosen for a request in the referenced claim.
                                  If empty, everything from the claim is made available, otherwise
                                  only the result of this request.
                                type: string
                            required:
                            - name
                            type: object
                          type: array
                          x-kubernetes-list-map-keys:
                          - name
                          x-kubernetes-list-type: map
                        limits:
                          additionalProperties:
                            anyOf:
                            - type: integer
                            - type: string
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          description: |-
                            Limits describes the maximum amount of compute resources allowed.
                            More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                          type: object
                        requests:
                          additionalProperties:
                            anyOf:
                            - type: integer
                            - type: string
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          description: |-
                            Requests describes the minimum amount of compute resources required.
                            If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                            otherwise to an implementation-defined value. Requests cannot exceed Limits.
                            More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                          type: object
                      type: object
                    schedule:
                      description: |-
                        Schedule defines when this stage should be invoked.
                        Only valid for entry stages (no dependsOn).
                      properties:
                        cron:
                          description: |-
                            Cron is a standard cron expression (e.g. "0 9 * * *").
                            Only used when mode is "cron".
                          type: string
                        interval:
                          description: |-
                            Interval is the duration between invocations (e.g. "30s", "5m", "1h").
                            Only used when mode is "interval".
                          type: string
                        mode:
                          default: trigger
                          description: 'Mode: "trigger" (on-demand), "interval" (every
                            N seconds), or "cron" (cron expression).'
                          enum:
                          - trigger
                          - interval
                          - cron
                          type: string
                      required:
                      - mode
                      type: object
                  required:
                  - entrypoint
                  - name
                  type: object
                type: array
            type: object
          status:
            description: PipelineStatus defines the observed state of Pipeline
            properties:
              buildFailures:
                description: |-
                  BuildFailures is the number of consecutive build failures for this pipeline.
                  Reset to 0 on a successful build. Used for exponential backoff.
                format: int32
                type: integer
              conditions:
                description: Conditions provides detailed reasons for the current
                  state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastBuiltSHA:
                description: |-
                  LastBuiltSHA is the git commit SHA that spec.image was built from. Only
                  populated when spec.build.pollInterval is set. Compared against the live
                  upstream SHA on each poll to decide whether to rebuild.
                type: string
              lastInvocation:
                description: |-
                  LastInvocation is the timestamp of the last scheduled invocation.
                  Used by the scheduler to determine when the next invocation should occur.
                format: date-time
                type: string
              lastPollTime:
                description: LastPollTime is the timestamp of the last upstream git
                  HEAD check.
                format: date-time
                type: string
              message:
                description: Message provides a human-readable explanation of the
                  current phase or error state.
                type: string
              observedGeneration:
                description: ObservedGeneration represents the .metadata.generation
                  that the condition was set based upon.
                format: int64
                type: integer
              phase:
                description: 'Phase: Pending, Provisioning, Running, Failed'
                type: string
              url:
                description: URL is the public endpoint if exposed
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
