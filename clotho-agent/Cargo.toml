[package]
name = "clotho-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
anyhow = "1.0"
# For K8s Service Account Token
k8s-openapi = { version = "0.20", features = ["v1_28"] }
kube = "0.87"