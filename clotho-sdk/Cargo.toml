[package]
name = "clotho-sdk"
version = "0.0.1"
edition = "2024"

[lib]
name = "clotho"
path = "src/lib.rs"

[features]
default = []
batch = ["dep:polars"]
native = ["dep:tokio", "dep:tokio-tungstenite"]

[dependencies]
clotho-macros = { path = "../clotho-macros" }
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.39", features = ["std"] }

# Serialization (works on both Spin/WASM and native)
bson = "2.11"
futures-util = "0.3"
lazy_static = "1.4"

# Batch Engine (Polars DataFrame) — only strictly available for batch pipelines
polars = { version = "0.44", features = ["lazy", "json"], optional = true }

# Optional: only needed for native (non-Spin) runtimes
tokio = { version = "1.0", features = ["sync", "macros", "io-util", "rt", "rt-multi-thread", "time", "net", "signal"], optional = true }
tokio-tungstenite = { version = "0.21", features = ["native-tls"], optional = true }
arrow = "53.0"
parquet = { version = "53.0", default-features = false, features = ["arrow", "json", "snap"] }

# MongoDB native driver — only for non-WASM targets (pulls in tokio networking)
[target.'cfg(not(target_family = "wasm"))'.dependencies]
mongodb = "2.8"
reqwest = { version = "0.11", features = ["json"] }
async-nats = "0.38"

[target.'cfg(target_family = "wasm")'.dependencies]
spin-sdk = { version = "3.1" }
