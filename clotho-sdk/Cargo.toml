[package]
name = "clotho-sdk"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["sync", "macros", "io-util", "rt", "time"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"