spin_manifest_version = 2

[application]
name = "daily-idea-pipeline"
version = "0.1.0"
authors = ["Clotho Team"]
description = "Example pipeline demonstrating API data fetching"

[[trigger.http]]
route = "/..."
component = "daily-idea"

[component.daily-idea]
source = "target/wasm32-wasip1/release/daily_idea.wasm"
allowed_outbound_hosts = ["https://api.example.com:443", "http://clotho-api.clotho-system.svc.cluster.local:3000"]
environment = { CLOTHO_PIPELINE_ID = "daily-idea", CLOTHO_API_URL = "http://clotho-api.clotho-system.svc.cluster.local:3000" }
[component.daily-idea.build]
command = "cargo build --target wasm32-wasip1 --release"
