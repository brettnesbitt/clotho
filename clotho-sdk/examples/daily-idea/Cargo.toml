[package]
name = "daily-idea"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "daily-idea"
path = "main.rs"

[dependencies]
clotho-sdk = { path = "../.." }
tokio = { version = "1.0", features = ["sync", "macros", "io-util", "rt", "time"] }
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
