apiVersion: apps/v1
kind: Deployment
metadata:
  name: clotho-api
  namespace: {{ .Values.namespace }}
  labels:
    app: clotho-api
    plane: control
    {{- include "clotho-control.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: clotho-api
  template:
    metadata:
      labels:
        app: clotho-api
        plane: control
    spec:
      serviceAccountName: clotho-api
      containers:
        - name: api
          image: {{ include "clotho-control.apiImage" . }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            - name: CLOTHO_NAMESPACE
              value: {{ .Values.pipelineNamespace | quote }}
          resources:
            requests:
              cpu: {{ .Values.api.resources.requests.cpu }}
              memory: {{ .Values.api.resources.requests.memory }}
            limits:
              cpu: {{ .Values.api.resources.limits.cpu }}
              memory: {{ .Values.api.resources.limits.memory }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 3
            periodSeconds: 10
