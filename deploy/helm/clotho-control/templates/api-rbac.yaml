apiVersion: v1
kind: ServiceAccount
metadata:
  name: clotho-api
  namespace: {{ .Values.namespace }}
  labels:
    app: clotho-api
    plane: control
    {{- include "clotho-system.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clotho-api-reader
  labels:
    app: clotho-api
    plane: control
    {{- include "clotho-system.labels" . | nindent 4 }}
rules:
  - apiGroups: ["core.clotho.run"]
    resources: ["pipelines"]
    verbs: ["get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clotho-api-reader-binding
  labels:
    app: clotho-api
    plane: control
    {{- include "clotho-system.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: clotho-api
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: clotho-api-reader
  apiGroup: rbac.authorization.k8s.io
