apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: clotho-data-proxy
  namespace: clotho-system
  labels:
    app.kubernetes.io/name: clotho-data-proxy
    app.kubernetes.io/component: data-plane
    app.kubernetes.io/part-of: clotho
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: clotho-data-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clotho-data-proxy
        app.kubernetes.io/component: data-plane
        app.kubernetes.io/part-of: clotho
    spec:
      containers:
        - name: proxy
          image: us-central1-docker.pkg.dev/quotopia-391900/clotho/clotho-data-proxy:latest
          ports:
            - containerPort: 9090
              name: http
          env:
            - name: PORT
              value: "9090"
            - name: RUST_LOG
              value: "clotho_data_proxy=info"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: clotho-data-proxy
  namespace: clotho-system
  labels:
    app.kubernetes.io/name: clotho-data-proxy
    app.kubernetes.io/component: data-plane
    app.kubernetes.io/part-of: clotho
spec:
  selector:
    app.kubernetes.io/name: clotho-data-proxy
  ports:
    - port: 9090
      targetPort: http
      protocol: TCP
      name: http
  type: ClusterIP
