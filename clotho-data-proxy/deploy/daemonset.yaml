apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: clotho-data-proxy
  namespace: clotho-system
  labels:
    app.kubernetes.io/name: clotho-data-proxy
    app.kubernetes.io/component: data-plane
    app.kubernetes.io/part-of: clotho
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: clotho-data-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clotho-data-proxy
        app.kubernetes.io/component: data-plane
        app.kubernetes.io/part-of: clotho
    spec:
      imagePullSecrets:
        - name: gcr-credentials
      containers:
        - name: proxy
          image: us-central1-docker.pkg.dev/quotopia-391900/clotho/clotho-data-proxy:redact-20260926
          ports:
            - containerPort: 9090
              name: http
          env:
            - name: PORT
              value: "9090"
            - name: RUST_LOG
              value: "clotho_data_proxy=info"
            # From a Secret, never a literal: this value used to be the full
            # connection string with the password inline, committed here and
            # visible to anyone who could read the DaemonSet.
            #
            # The URI lists all three members plus replicaSet=stockseer-mongo.
            # It used to name only the headless service, which resolves to every
            # mongod pod including any that is NOT in the replica set. A proxy
            # whose first connection landed on such a pod could never discover
            # the primary and crash-looped (1,544 restarts on pi-node-3, Sep
            # 2026), so whether a restarted proxy worked was down to DNS order.
            # With replicaSet set, the driver ignores non-members.
            #   kubectl -n clotho-system create secret generic clotho-mongo-credentials \
            #     --from-literal=uri='mongodb://USER:PASS@stockseer-mongo-0.stockseer-mongo-svc.mongodb.svc.cluster.local:27017,stockseer-mongo-1.stockseer-mongo-svc.mongodb.svc.cluster.local:27017,stockseer-mongo-2.stockseer-mongo-svc.mongodb.svc.cluster.local:27017/?authSource=admin&replicaSet=stockseer-mongo'
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: clotho-mongo-credentials
                  key: uri
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: clotho-data-proxy
  namespace: clotho-system
  labels:
    app.kubernetes.io/name: clotho-data-proxy
    app.kubernetes.io/component: data-plane
    app.kubernetes.io/part-of: clotho
spec:
  selector:
    app.kubernetes.io/name: clotho-data-proxy
  ports:
    - port: 9090
      targetPort: http
      protocol: TCP
      name: http
  type: ClusterIP
