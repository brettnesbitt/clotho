[package]
name = "clotho-data-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["trace"] }

# MongoDB
mongodb = "2.8"
bson = "2.11"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging / Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"

# Connection pooling cache (URI → Client)
dashmap = "5"
