apiVersion: core.clotho.run/v1alpha1
kind: Pipeline
metadata:
  name: crawler-yahoo
  namespace: default
spec:
  runtime: "wasm"
  mode: "once"
  gitRepository: "https://github.com/brettnesbitt/clotho.git"
  reference: "examples-and-infra"
  path: ".clotho-stockseer/news-crawler"
  config:
    - name: CRAWLER_SOURCE
      value: "Yahoo"
    - name: CRAWLER_FEEDS
      value: '[{"url":"https://feeds.finance.yahoo.com/rss/2.0/headline?s=AAPL&region=US&lang=en-US","symbols":["AAPL"]},{"url":"https://feeds.finance.yahoo.com/rss/2.0/headline?s=GOOGL&region=US&lang=en-US","symbols":["GOOGL"]},{"url":"https://feeds.finance.yahoo.com/rss/2.0/headline?s=TSLA&region=US&lang=en-US","symbols":["TSLA"]},{"url":"https://feeds.finance.yahoo.com/rss/2.0/headline?s=MSFT&region=US&lang=en-US","symbols":["MSFT"]},{"url":"https://feeds.finance.yahoo.com/rss/2.0/headline?s=AMZN&region=US&lang=en-US","symbols":["AMZN"]}]'
    - name: MONGO_URI
      valueFrom:
        secretKeyRef:
          name: stockseer-secrets
          key: mongo-uri
    - name: MONGO_DB
      value: "bluesky_db"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  schedule:
    mode: "interval"
    interval: "30m"
